name: econtent-auth-tests
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_PASSWORD: local-test-only
      POSTGRES_DB: postgres
    volumes:
      - ./local-init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
    ports: ["127.0.0.1:55322:5432"]
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      retries: 30
  mail:
    image: ${ECONTENT_TEST_MAILPIT_IMAGE:-public.ecr.aws/supabase/mailpit:v1.30.2}
    ports: ["127.0.0.1:55324:8025"]
    mem_limit: 128m
  auth:
    image: ${ECONTENT_TEST_GOTRUE_IMAGE:-public.ecr.aws/supabase/gotrue:v2.197.0}
    depends_on:
      db:
        condition: service_healthy
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: http://localhost:55321/auth/v1
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:local-test-only@db:5432/postgres?search_path=auth
      GOTRUE_SITE_URL: http://localhost:3000
      GOTRUE_URI_ALLOW_LIST: http://localhost:3000/**,http://127.0.0.1:3000/**
      GOTRUE_JWT_SECRET: local-econtent-test-secret-at-least-32-characters
      GOTRUE_JWT_EXP: 60
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_DISABLE_SIGNUP: "false"
      GOTRUE_MAILER_AUTOCONFIRM: "false"
      GOTRUE_PASSWORD_MIN_LENGTH: 12
      GOTRUE_SMTP_HOST: mail
      GOTRUE_SMTP_PORT: 1025
      GOTRUE_SMTP_ADMIN_EMAIL: local-test@econtent.invalid
      GOTRUE_SMTP_SENDER_NAME: Econtent local tests
      GOTRUE_SMTP_MAX_FREQUENCY: 1s
      GOTRUE_RATE_LIMIT_EMAIL_SENT: 100
      GOTRUE_RATE_LIMIT_TOKEN_REFRESH: 1000
      GOTRUE_MAILER_URLPATHS_CONFIRMATION: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_RECOVERY: /auth/v1/verify
    ports: ["127.0.0.1:55325:9999"]
    mem_limit: 256m
  rest:
    image: ${ECONTENT_TEST_POSTGREST_IMAGE:-public.ecr.aws/supabase/postgrest:v16.3}
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGRST_DB_URI: postgres://authenticator:local-test-only@db:5432/postgres
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: local-econtent-test-secret-at-least-32-characters
    ports: ["127.0.0.1:55326:3000"]
    mem_limit: 128m
