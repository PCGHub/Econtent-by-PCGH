name: Validate editor
on:
  push:
    branches-ignore: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - run: npm install
      - name: Dependency lock transfer for restricted workspace
        run: node -e "console.log('ECONTENT_LOCK=' + require('node:zlib').gzipSync(require('node:fs').readFileSync('package-lock.json')).toString('base64'))"
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npm run test:media
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
