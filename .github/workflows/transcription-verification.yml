name: Transcription Studio verification
on:
  push:
    branches:
      - integration/transcription-recovery
  pull_request:
    paths:
      - 'components/transcription-studio.tsx'
      - 'lib/transcription/**'
      - 'tests/**'
      - '.github/workflows/transcription-verification.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
